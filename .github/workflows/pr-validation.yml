name: PR Validation

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run tests
      run: |
        pytest
    
    - name: Verify module import
      run: |
        python -c "from weather.weather import get_weather; print('✓ Module import successful')"
    
    - name: Check code quality (Python 3.12 only)
      if: matrix.python-version == '3.12'
      run: |
        pip install flake8
        flake8 src/weather --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/weather --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
